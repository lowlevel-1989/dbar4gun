<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 250" width="390" height="250" font-family="sans-serif">
  <!-- Colocacion de la sensor bar: encima de la TV, centrada y con el frente alineado con la pantalla -->
  <rect width="390" height="250" rx="12" fill="#f4f6f8"/>

  <!-- vista frontal -->
  <g transform="translate(30,40)">
    <rect x="0" y="22" width="220" height="132" rx="6" fill="#2b2f36"/>
    <rect x="8" y="30" width="204" height="116" rx="2" fill="#5b6472"/>
    <rect x="90" y="150" width="40" height="22" fill="#2b2f36"/>
    <rect x="60" y="172" width="100" height="8" rx="3" fill="#2b2f36"/>
    <rect x="70" y="8" width="80" height="12" rx="4" fill="#111"/>
    <circle cx="80" cy="14" r="3" fill="#e5484d"/><circle cx="140" cy="14" r="3" fill="#e5484d"/>
    <line x1="110" y1="0" x2="110" y2="190" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <!-- vista lateral (la pantalla mira a la derecha) -->
  <g transform="translate(290,40)">
    <rect x="20" y="22" width="22" height="132" rx="4" fill="#2b2f36"/>
    <rect x="40" y="30" width="4" height="116" fill="#8fa3bf"/>
    <rect x="18" y="8" width="26" height="12" rx="4" fill="#111"/>
    <rect x="26" y="154" width="10" height="18" fill="#2b2f36"/>
    <rect x="6" y="172" width="50" height="8" rx="3" fill="#2b2f36"/>
    <line x1="44" y1="0" x2="44" y2="160" stroke="#e5484d" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

</svg>
