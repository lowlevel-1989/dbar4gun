name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # contenedores oficiales: python 3.7 ya no esta en setup-python/ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: system deps (evdev se compila)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev linux-libc-dev
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pytest
      - name: pytest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -v
