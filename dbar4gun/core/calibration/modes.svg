<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 560" width="790" height="560" font-family="sans-serif" font-size="13">
  <!-- Modos de calibracion: targets (en orden de disparo, core/gun.py calibration_targets) y mapa que se calcula (maps.py) -->
  <rect width="790" height="560" rx="12" fill="#f4f6f8"/>
  <defs>
    <g id="t">
      <circle r="9" fill="none" stroke="#f2c94c" stroke-width="2"/>
      <path d="M-14 0 h28 M0 -14 v28" stroke="#f2c94c" stroke-width="2"/>
    </g>
  </defs>

  <!-- pantalla 300x170: x = 300*u, y = 45 + 170*v; useful zone 0.85 (linea discontinua) -->
  <!-- modo 1 -->
  <g transform="translate(30,0)">
    <text x="0" y="34" font-weight="bold" fill="#2b2f36">mode 1 · 2pt</text>
    <rect x="0" y="45" width="300" height="170" fill="#2b2f36"/>
    <line x1="0" y1="189.5" x2="300" y2="189.5" stroke="#c9d1db" stroke-dasharray="6 4"/>
    <use href="#t" x="150" y="130"/><text x="166" y="126" fill="#fff" font-weight="bold">1</text>
    <use href="#t" x="30" y="62"/><text x="46" y="58" fill="#fff" font-weight="bold">2</text>
    <text x="0" y="240" fill="#2b2f36" font-weight="bold">solve_scale_offset_2pt</text>
    <text x="0" y="260" fill="#2b2f36">x' = kx · x + ox  |  y' = ky · y + oy</text>
  </g>

  <!-- modo 2 -->
  <g transform="translate(460,0)">
    <text x="0" y="34" font-weight="bold" fill="#2b2f36">mode 2 · 3pt (default)</text>
    <rect x="0" y="45" width="300" height="170" fill="#2b2f36"/>
    <line x1="0" y1="189.5" x2="300" y2="189.5" stroke="#c9d1db" stroke-dasharray="6 4"/>
    <use href="#t" x="30" y="62"/><text x="46" y="58" fill="#fff" font-weight="bold">1</text>
    <use href="#t" x="270" y="62"/><text x="244" y="58" fill="#fff" font-weight="bold">2</text>
    <use href="#t" x="150" y="189.5"/><text x="166" y="184" fill="#fff" font-weight="bold">3</text>
    <text x="0" y="240" fill="#2b2f36" font-weight="bold">solve_affine_3pt</text>
    <text x="0" y="260" fill="#2b2f36">screen = A · c + b</text>
  </g>

  <!-- modo 3 -->
  <g transform="translate(30,280)">
    <text x="0" y="34" font-weight="bold" fill="#2b2f36">mode 3 · 4pt</text>
    <rect x="0" y="45" width="300" height="170" fill="#2b2f36"/>
    <line x1="0" y1="189.5" x2="300" y2="189.5" stroke="#c9d1db" stroke-dasharray="6 4"/>
    <use href="#t" x="30" y="62"/><text x="46" y="58" fill="#fff" font-weight="bold">1</text>
    <use href="#t" x="270" y="62"/><text x="244" y="58" fill="#fff" font-weight="bold">2</text>
    <use href="#t" x="270" y="189.5"/><text x="244" y="184" fill="#fff" font-weight="bold">3</text>
    <use href="#t" x="30" y="189.5"/><text x="46" y="184" fill="#fff" font-weight="bold">4</text>
    <text x="0" y="240" fill="#2b2f36" font-weight="bold">solve_homography_4pt</text>
    <text x="0" y="260" fill="#2b2f36">screen = H · (c, 1)</text>
  </g>

  <!-- recalibracion rapida -->
  <g transform="translate(460,280)">
    <text x="0" y="34" font-weight="bold" fill="#2b2f36">quick · A + plus</text>
    <rect x="0" y="45" width="300" height="170" fill="#2b2f36"/>
    <line x1="0" y1="189.5" x2="300" y2="189.5" stroke="#c9d1db" stroke-dasharray="6 4"/>
    <use href="#t" x="30" y="62"/><text x="46" y="58" fill="#fff" font-weight="bold">1</text>
    <use href="#t" x="270" y="62"/><text x="244" y="58" fill="#fff" font-weight="bold">2</text>
    <text x="0" y="240" fill="#2b2f36" font-weight="bold">quick_recalibrate</text>
    <text x="0" y="260" fill="#2b2f36">kx, ox, oy</text>
  </g>
</svg>
