<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="sans-serif" font-size="13">
  <!-- Area profile (core/area.py): parte de la TV que ocupa la imagen del juego -->
  <rect width="640" height="280" rx="12" fill="#f4f6f8"/>
  <text x="20" y="30" font-weight="bold" fill="#2b2f36">area profile 4:3 · TV 16:9</text>

  <rect x="40" y="50" width="320" height="180" fill="#2b2f36"/>
  <rect x="80" y="50" width="240" height="180" fill="#5b6472"/>
  <line x1="40" y1="242" x2="80" y2="242" stroke="#e5484d" stroke-width="2"/>
  <text x="60" y="258" text-anchor="middle" fill="#e5484d" font-size="12">x0</text>
  <line x1="80" y1="242" x2="320" y2="242" stroke="#3e7bd6" stroke-width="2"/>
  <text x="200" y="258" text-anchor="middle" fill="#3e7bd6" font-size="12">w</text>
  <circle cx="290" cy="90" r="5" fill="#f2c94c"/>
  <text x="298" y="86" fill="#f2c94c" font-size="12">x</text>

  <text x="390" y="80" fill="#2b2f36">out = (x - x0) / w</text>
  <text x="390" y="104" fill="#2b2f36">4:3: x0 = 0.125, w = 0.75</text>
  <text x="390" y="128" fill="#2b2f36">full: x0 = 0, w = 1</text>
</svg>
